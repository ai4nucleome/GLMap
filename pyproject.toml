# Editable-development configuration only. GLMap is a research repository,
# not a published package: `pip install -e .` just makes `glmap` importable
# (for tests/scripts) and installs the analysis/figure dependencies. This
# file is NOT used to build or publish a distribution.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4nucleome-glmap"
version = "0.1.0"
requires-python = ">=3.10"
# Core: matrix loading, analysis, figures (no torch). Scoring (running GLMs
# to obtain raw likelihood responses) needs the `scoring` extra; many model
# families also need family-specific deps — see models/env_routing.md.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "umap-learn",
    "PyYAML",
    "huggingface_hub",  # panel download fallback (load_panel); lightweight, no torch
]

[project.optional-dependencies]
scoring = ["torch", "transformers"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["models", "out_*", "data", "figures", ".git", "__pycache__"]
